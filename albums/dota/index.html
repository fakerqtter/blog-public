</style><script>document.addEventListener('DOMContentLoaded', function () {
  try {
    var gallery = $('#mygallery');
    var loadingMsg = document.getElementById('loading-message');
    var videoModal = document.getElementById('video-modal');
    var modalVideo = document.getElementById('modal-video');
    var closeButton = document.querySelector('.close-button');

    if (gallery.length > 0) {
      gallery.justifiedGallery({
        rowHeight: 200,
        margins: 5,
        waitThumbnailsLoad: false,
        lastRow: 'justify'
      }).on('jg.complete', function () {
        if (loadingMsg) loadingMsg.style.display = 'none';
        gallery.addClass('jg-loaded');
        enhanceVideoItems();
      });
    }

    function enhanceVideoItems() {
      gallery.find('a[data-video="true"]').each(function() {
        var $link = $(this);
        
        $link.addClass('video-link');
        $link.attr('href', 'javascript:void(0)');
        
        // 添加永久视频角标
        var $badge = $('<div class="video-badge"><i class="fa fa-video-camera"></i></div>');
        $link.append($badge);
        
        // 添加悬停遮罩层
        var $overlay = $('<div class="video-overlay"></div>');
        var $playBtn = $('<div class="play-button"><i class="fa fa-play"></i></div>');
        $overlay.append($playBtn);
        $link.append($overlay);
        
        $link.removeAttr('data-video');
      });
      
      $('.video-link').on('click', function(e) {
        e.preventDefault();
        var videoUrl = $(this).attr('data-video-url');
        if (videoUrl) {
          openVideoModal(videoUrl);
        }
      });
    }

    function openVideoModal(videoUrl) {
      if (modalVideo && videoModal) {
        modalVideo.src = videoUrl;
        videoModal.classList.add('active');
        document.body.style.overflow = 'hidden';
        modalVideo.load();
        modalVideo.play().catch(function() {});
      }
    }

    function closeVideoModal() {
      if (modalVideo && videoModal) {
        modalVideo.pause();
        modalVideo.currentTime = 0;
        videoModal.classList.remove('active');
        modalVideo.src = '';
        document.body.style.overflow = '';
      }
    }

    if (closeButton) {
      closeButton.addEventListener('click', closeVideoModal);
    }

    if (videoModal) {
      videoModal.addEventListener('click', function(e) {
        if (e.target === videoModal) {
          closeVideoModal();
        }
      });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && videoModal && videoModal.classList.contains('active')) {
        closeVideoModal();
      }
    });
  } catch (error) {
    console.error('相册初始化错误:', error);
  }
});</script></div><div id="container"></div><link rel="stylesheet" type="text/css" href="https://unpkg.com/gitalk/dist/gitalk.css"><script type="text/javascript" src="https://unpkg.com/blueimp-md5/js/md5.js"></script><script type="text/javascript" src="https://unpkg.com/gitalk/dist/gitalk.min.js"></script><script>var gitalk = new Gitalk({
